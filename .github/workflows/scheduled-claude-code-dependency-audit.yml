name: Planifié - Audit des dépendances

on:
  schedule:
    # S'exécute toutes les 2 semaines (le 1er et le 15 de chaque mois) à 10 h UTC
    - cron: '0 10 1,15 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Recherche des dépendances obsolètes
        id: check-outdated
        run: |
          echo "Recherche des dépendances obsolètes..."
          npm outdated --json > /tmp/outdated.json 2>/dev/null || true

          if [ ! -s /tmp/outdated.json ] || [ "$(cat /tmp/outdated.json)" = "{}" ]; then
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "Aucune dépendance obsolète trouvée"
          else
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            echo "Dépendances obsolètes trouvées"
            cat /tmp/outdated.json
          fi

      - name: Audit de sécurité
        id: security-audit
        run: |
          echo "Audit de sécurité en cours..."
          npm audit --json > /tmp/audit.json 2>/dev/null || true

          if [ -s /tmp/audit.json ]; then
            VULNERABILITIES=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('total',0))" 2>/dev/null || echo "0")
            echo "vulnerabilities=$VULNERABILITIES" >> $GITHUB_OUTPUT
            echo "$VULNERABILITIES vulnérabilité(s) trouvée(s)"
          else
            echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          fi

      - name: Analyse et mise à jour des dépendances par Claude
        if: steps.check-outdated.outputs.has_outdated == 'true' || steps.security-audit.outputs.vulnerabilities != '0'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-5-20251101
          timeout_minutes: 45
          base_branch: main
          branch_prefix: claude/deps-update-
          track_progress: true
          prompt: |
            # Audit des dépendances

            Vous exécutez un audit planifié des dépendances.

            ## Vos tâches

            1. **Analysez les paquets obsolètes** : lancez `npm outdated` et examinez les résultats

            2. **Analysez les vulnérabilités de sécurité** : lancez `npm audit` et examinez les résultats

            3. **Mettez à jour les paquets sans prendre de risques** :
               - Utilisez `npm update {package}` pour les mises à jour mineures/correctives
               - Pour les versions majeures, utilisez `npm install {package}@latest` uniquement si c'est sans risque
               - Lancez `npm audit fix` pour les correctifs de sécurité

            4. **Vérifiez les mises à jour** :
               - Lancez `npm run lint` pour détecter les problèmes
               - Lancez `npm test` pour vérifier que les tests passent
               - En cas d'échec, annulez la mise à jour concernée

            5. **Créez une PR** si des mises à jour ont été faites :
               - Créez une branche à partir de main
               - Commitez les modifications de package.json et package-lock.json
               - Titre de la PR : "chore(deps): mise à jour des dépendances"
               - Le corps de la PR doit lister :
                 - Chaque paquet mis à jour, avec ancienne → nouvelle version
                 - Les vulnérabilités de sécurité corrigées (le cas échéant)

            ## Consignes
            - Soyez PRUDENT - dans le doute, ne mettez pas à jour
            - Si les tests échouent après une mise à jour, annulez cette mise à jour
            - Regroupez les mises à jour liées
            - Si AUCUNE mise à jour n'est possible, signalez-le et ne créez pas de PR
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*)"

      - name: Signaler qu'aucune mise à jour n'est nécessaire
        if: steps.check-outdated.outputs.has_outdated == 'false' && steps.security-audit.outputs.vulnerabilities == '0'
        run: |
          echo "Toutes les dépendances sont à jour et aucune vulnérabilité de sécurité n'a été trouvée."
          echo "Aucune action nécessaire."
