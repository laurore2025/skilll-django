name: Planifié - Synchronisation de la documentation

on:
  schedule:
    # S'exécute le 1er de chaque mois à 9 h UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Nombre de jours à remonter pour rechercher des modifications'
        required: false
        default: '30'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recherche des modifications de code sur la période
        id: check-changes
        run: |
          DAYS_BACK="${{ github.event.inputs.days_back || '30' }}"
          SINCE_DATE=$(date -d "-${DAYS_BACK} days" +%Y-%m-%d)

          echo "Recherche des modifications depuis le $SINCE_DATE"

          # Récupérer les fichiers de code modifiés (hors documentation elle-même)
          CHANGED_FILES=$(git log --since="$SINCE_DATE" --name-only --pretty=format: -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' \
            ':!*.test.*' ':!*.spec.*' ':!*.stories.*' \
            | sort -u | grep -v '^$' | head -100)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Aucune modification de code trouvée au cours des $DAYS_BACK derniers jours"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "$(echo "$CHANGED_FILES" | wc -l) fichier(s) modifié(s) trouvé(s)"
          fi

          echo "since_date=$SINCE_DATE" >> $GITHUB_OUTPUT

      - name: Synchronisation de la documentation par Claude
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-5-20251101
          timeout_minutes: 60
          base_branch: main
          branch_prefix: claude/docs-sync-
          track_progress: true
          prompt: |
            # Synchronisation mensuelle de la documentation

            Vous exécutez une synchronisation planifiée de la documentation. Le code a changé depuis le ${{ steps.check-changes.outputs.since_date }}.

            ## Fichiers modifiés
            Les fichiers de code suivants ont été modifiés :
            ```
            ${{ steps.check-changes.outputs.changed_files }}
            ```

            ## Vos tâches

            1. **Analysez les modifications** : examinez les fichiers modifiés pour comprendre quelles fonctionnalités ont été ajoutées, modifiées ou supprimées.

            2. **Trouvez la documentation concernée** : recherchez la documentation susceptible d'être affectée :
               - le répertoire `/docs/`
               - les fichiers README.md
               - les commentaires TSDoc dans le code

            3. **Recherchez les problèmes réels** : pour chaque modification du code, déterminez si la documentation existante est désormais FAUSSE :
               - Les exemples de code fonctionnent-ils encore ?
               - Les signatures/types d'API sont-ils désormais incorrects ?
               - Les interfaces de props sont-elles obsolètes ?

            4. **Ne corrigez que ce qui est cassé** : si vous trouvez de la documentation réellement fausse :
               - Corrigez les exemples de code incorrects
               - Mettez à jour les signatures et types d'API erronés
               - N'ajoutez de la documentation QUE pour les nouvelles fonctionnalités importantes qui n'en ont aucune

            5. **Créez une PR** : si vous avez apporté des modifications :
               - Créez une nouvelle branche à partir de main
               - Commitez toutes les mises à jour de la documentation
               - Créez une PR avec un résumé de ce qui a été corrigé

            ## Consignes CRITIQUES
            - La documentation est un DOCUMENT VIVANT - ne corrigez que ce qui est réellement FAUX
            - N'ajoutez PAS d'entrées de type changelog
            - Ne mettez à jour la documentation QUE lorsqu'elle est incorrecte ou trompeuse
            - Si aucun problème n'est trouvé, signalez-le et NE créez PAS de PR
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*)"

      - name: Signaler l'absence de modifications
        if: steps.check-changes.outputs.has_changes == 'false'
        run: |
          echo "Aucune modification de code trouvée au cours des ${{ github.event.inputs.days_back || '30' }} derniers jours."
          echo "Synchronisation de la documentation ignorée."
